name: Uptime check

# Checks /api/health every 10 minutes (GitHub may start scheduled runs a few minutes late).
# A failed run means the site or its database is down: GitHub emails the repo owner about it.
# It also keeps the Supabase free-tier DB from pausing. /api/health stays up in maintenance mode.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # manual run from the Actions tab

jobs:
  ping:
    name: GET /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check health
        run: |
          # The apex domain redirects to www; -L follows it. Retries ride out a cold start or a single blip.
          STATUS=$(curl --silent --show-error --location --max-time 30 --retry 2 --retry-delay 20 --retry-all-errors \
            --output body.json --write-out "%{http_code}" https://www.placeprep.me/api/health || echo 000)
          echo "HTTP $STATUS: $(cat body.json 2>/dev/null)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::PlacePrep health check failed with HTTP $STATUS"
            exit 1
          fi
